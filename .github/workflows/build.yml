name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o ArabicCountryCounter_Ready.zip
          ls -la
          ls -la arab_countries

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix memory and create wrapper
        working-directory: arab_countries
        run: |
          cat > gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          gradle wrapper --gradle-version 8.9 || true

      - name: Build Debug APK
        working-directory: arab_countries
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicCountryCounter-APK
          path: arab_countries/app/build/outputs/apk/debug/*.apk
